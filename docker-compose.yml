name: saizhijian

services:
  postgres:
    image: postgres:18.4
    container_name: saizhijian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saizhijian
      POSTGRES_USER: saizhijian
      POSTGRES_PASSWORD: saizhijian
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - saizhijian_pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saizhijian -d saizhijian"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  saizhijian_pgdata18:
