name: Release clients

on:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: frontend
        run: flutter pub get
      - name: Configure Android signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_STORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p frontend/android/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > frontend/android/signing/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../signing/upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > frontend/android/key.properties
      - working-directory: frontend
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
      - working-directory: frontend
        run: flutter build appbundle --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            frontend/build/app/outputs/flutter-apk/*.apk
            frontend/build/app/outputs/bundle/release/*.aab

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: choco install innosetup --yes --no-progress
      - working-directory: frontend
        run: flutter pub get
      - working-directory: frontend
        run: flutter build windows --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
      - shell: pwsh
        run: |
          $env:APP_VERSION = '${{ github.ref_name }}'.TrimStart('v')
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer\windows\saizhijian.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: installer/windows/output/*.exe

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: frontend
        run: flutter pub get
      - working-directory: frontend
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
      - name: Build macOS and DMG
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: bash scripts/build-apple.sh
      - run: ditto -c -k --sequesterRsrc --keepParent frontend/build/ios/iphoneos/Runner.app frontend/build/ios/saizhijian-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple-unsigned
          path: |
            frontend/build/ios/saizhijian-ios-unsigned.zip
            frontend/build/macos/dmg/*.dmg
